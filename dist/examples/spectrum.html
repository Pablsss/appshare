<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Spectrum · AppShare</title><style>body{max-width:52rem;margin:8vh auto;padding:1rem;font:18px system-ui;color:#202f50}button{cursor:pointer;border:1px solid #64748b;border-radius:16px;padding:3rem 1rem 1rem;margin:.25rem;font:inherit}span{background:white;color:#162343;padding:.3rem;border-radius:.4rem}</style><h1>Spectrum</h1><p>Select a swatch to copy its hex value.</p><main></main><p role="status"></p><script>
for(const color of ['#A2D2FF','#BDB2FF','#FFC6A5','#A6E4D0','#FF99AB']){
 const button=document.createElement('button');button.style.background=color;
 const label=document.createElement('span');label.textContent=color;button.append(label);
 button.onclick=async()=>{try{await navigator.clipboard.writeText(color);document.querySelector('[role=status]').textContent='Copied '+color;}catch{document.querySelector('[role=status]').textContent='Hex value: '+color;}};
 document.querySelector('main').append(button);}
